<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280">
  <title>Gabriela Hranovschi — logo vertical</title>
  <desc>Vertical lockup with symbol stacked above wordmark. Use for printed cards, posters, social profile headers.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&amp;family=Nunito+Sans:wght@300&amp;display=swap');
      .gh-name { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 38px; fill: #3D2E2A; letter-spacing: 0.005em; }
      .gh-tag  { font-family: 'Nunito Sans', 'Helvetica Neue', sans-serif; font-weight: 300; font-size: 11px; fill: #6B5852; letter-spacing: 0.34em; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Symbol -->
  <path d="M 100 110 Q 160 178 220 110"
        fill="none"
        stroke="#3D2E2A"
        stroke-width="6"
        stroke-linecap="round"/>
  <circle cx="160" cy="76" r="17" fill="#C4634A"/>

  <!-- Wordmark -->
  <text x="160" y="222" text-anchor="middle" class="gh-name">gabriela hranovschi</text>
  <text x="160" y="248" text-anchor="middle" class="gh-tag">specialist în dezvoltarea copilului</text>
</svg>
